<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Movie - Movie Web App</title>
    <link rel="stylesheet" href="../../../../static/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header -->
    <header class="bg-primary text-white py-3 mb-4">
        <h1 class="text-center">🎬 Update Movie Details</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-light" href="/">🏠 Home</a>
            <a class="nav-link text-light" href="/users">👥 View Users</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="col-md-6 mx-auto">
            <form action="{{ url_for('update_movie', user_id=user.id, movie_id=movie.id) }}" method="POST" class="p-4 bg-white rounded shadow">
                <h2 class="text-center mb-4 text-primary">Edit Movie Info</h2>

                <div class="mb-3">
                    <label for="movie_name" class="form-label fw-bold">Movie Title:</label>
                    <input type="text" id="movie_name" name="movie_name" value="{{ movie.name }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="director" class="form-label fw-bold">Director:</label>
                    <input type="text" id="director" name="director" value="{{ movie.director }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="year" class="form-label fw-bold">Release Year:</label>
                    <input type="number" id="year" name="year" value="{{ movie.year }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label fw-bold">Rating:</label>
                    <input type="text" id="rating" name="rating" value="{{ movie.rating }}" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">💾 Update Movie</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('user_movies', user_id=user.id) }}" class="btn btn-secondary">⬅️ Go Back</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-5 text-center">
        <p class="mb-0">&copy; 2024 Movie Web App. All rights reserved.</p>
    </footer>

    <script src="../../../../static/bootstrap.bundle.min.js"></script>
</body>
</html>
