<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie - Movie Web App</title>
    <link rel="stylesheet" href="../../static/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎬 Movie Web App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-semibold" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger fw-semibold" href="/users">View Users</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h1 class="text-center text-primary fw-bold">Add a New Movie</h1>
                        <form action="{{ url_for('add_movie', user_id=user.id) }}" method="POST">
                            <!-- Movie Name -->
                            <div class="mb-3">
                                <label for="movie_name" class="form-label fw-semibold">Movie Title</label>
                                <input type="text" class="form-control" id="movie_name" name="movie_name" required>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success fw-bold">🎥 Fetch & Add Movie</button>
                            </div>
                        </form>

                        <!-- Go Back Link -->
                        <div class="text-center mt-3">
                            <a href="{{ url_for('user_movies', user_id=user.id) }}" class="btn btn-outline-secondary">⬅️ Go Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <p class="mb-0">&copy; 2024 Movie Web App. All rights reserved.</p>
    </footer>

    <script src="../../static/bootstrap.bundle.min.js"></script>
</body>
</html>
