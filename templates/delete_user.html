<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/bootstrap.min.css">
    <title>Delete User - Movie Web App</title>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="bg-warning text-dark py-3 mb-4">
        <h1 class="text-center">⚠️ Confirm User Deletion</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-dark fw-bold" href="/">🏠 Home</a>
            <a class="nav-link text-dark fw-bold" href="/users">👥 View Users</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mt-4 text-center">
        <h2 class="mb-3">Are you sure you want to delete <strong class="text-danger">"{{ user.username }}"</strong>?</h2>
        <p class="text-muted">This action <strong>cannot be undone</strong>.</p>

        <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" class="mt-4">
            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-danger">❌ Delete User</button>
                <a href="{{ url_for('list_users') }}" class="btn btn-secondary">❎ Cancel</a>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-5 text-center">
        <p class="mb-0">&copy; 2024 Movie Web App. All rights reserved.</p>
    </footer>

</body>
</html>
